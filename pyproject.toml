[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolved-circuits"
version = "0.1.0"
description = "Bounded developmental genetic programming for conditional passive circuits"
requires-python = ">=3.12,<3.13"
dependencies = ["deap==1.4.3", "numpy==2.2.6", "matplotlib==3.10.3"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
evolved-circuits = "evolved_circuits.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
